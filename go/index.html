<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiller - ממשיכים להזמנה</title>
    <!-- Link preview (WhatsApp/Telegram/etc.). Links sent by the bot are chiller-travel.com/l/<code>,
         which the bot answers with a per-link preview (the link's own label); these are the static
         fallback for a /go link shared directly. -->
    <meta property="og:site_name" content="Chiller">
    <meta property="og:title" content="Chiller - ממשיכים להזמנה">
    <meta property="og:description" content="עוזר הנסיעות החכם לתרמילאים: לינה, טיסות, מעברים, אטרקציות ו-eSIM.">
    <meta property="og:image" content="https://chiller-travel.com/og-chiller-v3.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Brand tokens — same values as the homepage (root index.html :root). */
        :root {
            --paper: #F3EADB; --paper-2: #EADFCB; --card: #FFFAF1; --line: #E0D3BD;
            --text: #14161A; --muted: #5E5A53;
            --orange: #FF5B22; --orange-2: #FF7A45; --orange-deep: #C2410C; --ink: #0B0D10;
            --ease: cubic-bezier(.16, 1, .3, 1);
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            background:
                radial-gradient(900px 560px at 88% 12%, rgba(255, 150, 90, .18), transparent 62%),
                radial-gradient(760px 620px at 4% 70%, rgba(205, 160, 95, .18), transparent 60%),
                radial-gradient(640px 420px at 70% 100%, rgba(255, 120, 60, .10), transparent 60%),
                var(--paper);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Heebo', system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 36px 28px 30px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 24px 60px -24px rgba(120, 70, 20, .28), 0 6px 18px -8px rgba(120, 70, 20, .14);
            animation: rise .5s var(--ease) both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            text-decoration: none;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: -.02em;
            margin-bottom: 26px;
        }
        .logo-mark {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: var(--orange);
            position: relative;
            display: grid;
            place-items: center;
            flex: none;
        }
        /* The notch on the mark takes the surface colour (ink on the dark homepage nav, card here). */
        .logo-mark::before {
            content: "";
            position: absolute;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--card);
            inset-inline-end: -5px;
            top: calc(50% - 5px);
        }
        .logo-mark svg { width: 18px; height: 18px; color: var(--ink); }

        .loader {
            width: 36px; height: 36px;
            border: 3px solid rgba(255, 91, 34, .16);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h2 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -.02em;
            line-height: 1.25;
            margin: 0 0 10px;
            overflow-wrap: anywhere;
        }
        #partner-name { color: var(--orange-deep); }

        p { margin: 0; }

        /* What the link opens (t param) — the most useful line on the page, so it stands out. */
        #redirect-desc {
            display: none;
            color: var(--text);
            font-size: 17px;
            font-weight: 500;
            line-height: 1.45;
            margin: 0 auto 12px;
            padding: 10px 14px;
            background: var(--paper);
            border-radius: 14px;
            overflow-wrap: anywhere;
        }

        #redirect-subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        /* redirect.js shows this with style.display = 'flex'. */
        .button-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 26px;
            width: 100%;
        }

        .btn {
            width: 100%;
            min-height: 52px;
            padding: 12px 22px;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            transition: transform .2s var(--ease), box-shadow .3s var(--ease), background .2s, border-color .2s;
        }
        .btn:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

        #continue-btn {
            background: var(--orange);
            color: #fff;
            border: 1px solid var(--orange);
            box-shadow: 0 10px 24px -10px rgba(255, 91, 34, .7);
        }
        #continue-btn:hover { background: var(--orange-2); border-color: var(--orange-2); transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(255, 91, 34, .75); }
        #continue-btn:active { transform: none; }

        #cancel-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
            font-weight: 600;
        }
        #cancel-btn:hover { background: var(--paper); border-color: #D2C2A6; }

        #debug-info {
            display: none;
            margin-top: 24px;
            padding: 14px;
            background: var(--ink);
            border-radius: 14px;
            text-align: right;
            font-size: 13px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color: #C9CDD3;
            overflow-wrap: anywhere;
        }
        #debug-info h3 { margin-top: 0; color: #f59e0b; }

        @media (max-width: 420px) {
            .container { padding: 30px 20px 24px; border-radius: 22px; }
            h2 { font-size: 22px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .container, .loader { animation: none; }
            .btn { transition: none; }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="bubble" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M4 20l1.5-4A8 8 0 1 1 8 19z"/></symbol>
    </svg>
    <main class="container">
        <a class="logo" href="/"><span class="logo-mark"><svg aria-hidden="true"><use href="#bubble"/></svg></span>צ׳ילר</a>
        <div class="loader"></div>
        <h2 id="redirect-title">ממשיכים ל-<span id="partner-name">השותף שלנו</span></h2>
        <p id="redirect-desc"></p>
        <p id="redirect-subtitle">רגע...</p>
        <div id="button-container" class="button-container">
            <button id="continue-btn" class="btn" type="button">המשך</button>
            <button id="cancel-btn" class="btn" type="button">ביטול</button>
        </div>
        <div id="debug-info"></div>
    </main>

    <script type="module" src="/src/go/redirect.js"></script>
</body>
</html>
