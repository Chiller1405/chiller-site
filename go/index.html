<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiller - מעביר אותך לשותף...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a;
            color: #f1f5f9;
            margin: 0;
            overflow: hidden;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, rgba(129, 140, 248, 0.05) 50%, transparent 100%);
            filter: blur(40px);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 2.5rem;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            z-index: 2;
            max-width: 400px;
            width: 90%;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .loader {
            border: 3px solid rgba(56, 189, 248, 0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }

        p {
            color: #94a3b8;
            font-size: 0.875rem;
            margin: 0;
        }

        .button-container {
            display: none;
            margin-top: 1.5rem;
            gap: 0.75rem;
            justify-content: center;
            width: 100%;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 0.75rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            flex: 1;
            transition: all 0.2s ease;
            text-align: center;
            box-sizing: border-box;
        }

        #continue-btn {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            color: #fff;
            border: none;
        }

        #continue-btn:hover {
            opacity: 0.9;
        }

        #cancel-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #cancel-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #debug-info {
            display: none;
            margin-top: 2rem;
            padding: 1rem;
            background: #0f172a;
            border-radius: 0.75rem;
            text-align: right;
            font-size: 0.825rem;
            font-family: monospace;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        #debug-info h3 {
            margin-top: 0;
            color: #f59e0b;
        }
    </style>
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y48i1zn527");
    </script>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="container">
        <div class="logo">Chiller</div>
        <div class="loader"></div>
        <h2 id="redirect-title">מעביר אותך ל-<span id="partner-name">השותף שלנו</span>...</h2>
        <p id="redirect-subtitle">מכין את ההצעה הטובה ביותר עבורך...</p>
        <div id="button-container" class="button-container">
            <button id="continue-btn" class="btn">המשך</button>
            <button id="cancel-btn" class="btn">ביטול</button>
        </div>
        <div id="debug-info"></div>
    </div>
    
    <script type="module" src="/src/go/redirect.js"></script>
</body>
</html>
